# Phase 1 data pipeline configuration (spec: specs/001-data-pipeline/spec.md).
# Constitution principle III: selection and threshold values live here, not in code.

source:
  raw_dir: data/raw/bts
  file: null                  # null → the single .zip/.csv found in raw_dir

selection:
  carrier: F9
  carrier_selection_reason: >-
    Frontier (F9): A320-family-only fleet, ~4.2k flights/week, 76 airports, 166 aircraft in Sep 2026
    BTS data; size close to the Turkish Airlines A320 crew pairing study. Spirit (NK) reports no
    flights in Sep 2026; Allegiant (G4) is smaller and no longer single-family.
  week_start: 2026-09-14      # Monday; no federal holiday (Labor Day is Sep 7), no DST change
  buffer_days: 3              # pairings last at most 4 days

validation:
  block_minutes: {min: 20, max: 480}
  elapsed_tolerance_minutes: 5
  tail_continuity_min_share: 0.95

exploration:
  base_max: 3
  base_min_share: 0.5
  candidate_carriers: [F9, NK]

output:
  processed_dir: data/processed
